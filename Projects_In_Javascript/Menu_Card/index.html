<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Cart</title>
    <style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background: #f5f7fb;
  color: #333;
}

/* MAIN CONTAINER */
.main {
  width: 90%;
  max-width: 1200px;
  margin: 40px auto;
}

/* TOP BAR */
.top-bar {
  text-align: center;
  margin-bottom: 30px;
}

.title {
  font-size: 2.5rem;
  font-weight: 600;
  color: #222;
}

.line {
  width: 80px;
  height: 4px;
  background: #ff6b6b;
  margin: 10px auto;
  border-radius: 10px;
}

/* FILTER SECTION */
.filter-Data {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 30px;
}

/* CATEGORY BUTTONS */
.category-selection {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.category-button {
  padding: 8px 16px;
  border: none;
  background: #fff;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}


.category-button:hover {
  background: #ff6b6b;
  color: #fff;
}

/* PRICE SELECT */
.price-selection select {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  cursor: pointer;
}

/* GRID */
.grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}

/* CARD */
.menu-card {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  padding: 15px;
  transition: 0.3s;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.menu-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* IMAGE */
.menu-image {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 12px;
}

/* TEXT */
.menu-title {
  font-size: 1.2rem;
  margin: 10px 0 5px;
  font-weight: 600;
}

.menu-description {
  font-size: 0.9rem;
  color: #666;
  margin-bottom: 10px;
}

.menu-price {
  font-weight: bold;
  color: #ff6b6b;
  margin-bottom: 10px;
}

/* BUTTON */
.add-to-cart {
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: #ff6b6b;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}
.active{
  background: #ff4b4b;
  color: #fff;
}

.add-to-cart:hover {
  background: #ff4b4b;
}
.cart-container {
  width: 100%;
  display: flex;
  justify-content: flex-end;
  margin-bottom: 20px;
}
.cart{
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  background: #ff6b6b;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}
.hidden{
  display: none;
}
    </style>
  </head>
  <body>
    <div class="main">
      <div class="top-bar">
        <div class="title">Menu</div>
        <div class="line"></div>
      </div>
      <div class="cart-container">
        <button class="cart">Cart</button>
      </div>
      <div class="filter-Data">
        <div class="category-selection">
          <button class="category-button" type="button" value="all">All</button>
          <button class="category-button" type="button" value="food">Food</button>
          <button class="category-button" type="button" value="breakfast">Breakfast</button>
          <button class="category-button" type="button" value="lunch">Lunch</button>
          <button class="category-button" type="button" value="dinner">Dinner</button>
          <button class="category-button" type="button" value="snacks">Snacks</button>
          <button class="category-button" type="button" value="drinks">Drinks</button>
          <button class="category-button" type="button" value="dessert">Dessert</button>
        </div>
        <div class="price-selection">
            <select name="price" id="select-price">Filter By Price
                <option disabled selected value="">Sort by Price</option>
                <option value="asc" id="asc">Lowest to Highest</option>
                <option value="desc" id="desc">Highest to Lowest</option>
            </select>
        </div>
      </div>
      <div class="grid-container">
       
          
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
