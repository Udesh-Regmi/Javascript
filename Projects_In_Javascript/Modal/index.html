<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal</title>
    <style>
      .main-container {
        width: 100%;
        height: 98vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
      }
      .main-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .center-container {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        width: 400px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      #open-modal {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
      .show{
        display:block 
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRHj0r68jZH4eo3fYSF4w2kuacrnLWu69OP644HsnhNkw&s=10"
        alt="Background-image"
        srcset=""
      />
      <div class="center-container">
        <div class="show">
               <h1>Modal Project</h1>
        <button id="open-modal">Open Modal</button>

        </div>
        <div class="hidden">
            <button id="close-modal">Close Modal</button>
          <h2>Modal Content</h2>
          <p>This is the content inside the modal.</p>
        </div>
     
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
