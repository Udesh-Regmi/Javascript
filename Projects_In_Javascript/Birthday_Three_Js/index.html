      body {

      }

      }

      }
      .question-text {
        font-family: "Courier New", Courier, monospace;
        color: #ffffff;
      }
      .gif-container {
        width: 300px;
        height: 200px;
        margin: 20px auto;
        border-radius: 10px;
        overflow: hidden;
      }
      
      .gif-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      
      }

      .photo-book {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90vw;
        max-width: 800px; /* Set a maximum width */
        height: auto;
        max-height: 90vh;
        background: rgba(255, 255, 255, 0.1);
        z-index: 2000;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }
      .photo-description {
        font-family: "Courier New", Courier, monospace;
        color: #ffffff;
      }
      .image-container {
        width: calc(
          100% * (9 / 16)
        ); /* Maintain the width for the aspect ratio */
        height: calc(
          100% * (16 / 9)
        ); /* Maintain the height for the aspect ratio */
        border-radius: 50%; /* Circular image */
        overflow: hidden; /* Ensure no overflow */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); /* Shadow for depth */
        display: flex; /* Center the image */
        justify-content: center;
        align-items: center;
      }
      #current-photo {
        width: auto; /* Allow auto width */
        height: 100%; /* Fill height */
      }
      .nav-button {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        background-color: rgba(0, 0, 255, 0.7);
        color: white;
        padding: 10px;
        border-radius: 5px;
        font-weight: bold;
      }
      #prev-btn {
        left: 10px; /* Position on the left */
      }
      #next-btn {
        right: 10px; /* Position on the right */

      #video-iframe {
        display: none;

        const moveRange = 10;

        const newX = Math.max(
          0, // Prevent the button from moving out of the left edge
          Math.min(
            windowWidth - buttonWidth, // Prevent the button from moving out of the right edge
            currentX + (Math.random() * moveRange * 2 - moveRange) // Move by random amount within range
          )
        );

          0, // Prevent the button from moving out of the top edge

            windowHeight - buttonHeight, // Prevent the button from moving out of the bottom edge
            currentY + (Math.random() * moveRange * 2 - moveRange) // Move by random amount within range
          )
        );

        // Use GSAP to animate the button to the new position
        gsap.to(noBtn, {
          left: newX,
          top: newY,
          position: "fixed",
          duration: 0.1,
          ease: "power2.out",
        });

      function updatePhotoBook() {
        const currentPhoto = photosData[currentPhotoIndex];
        const photoElement = document.getElementById("current-photo");

        // Apply the glassmorphism effect
        photoElement.classList.add("glassmorphism-border");
        photoElement.src = currentPhoto.url;
        document.getElementById("photo-description").textContent =
          currentPhoto.description;
      }

      document.getElementById("next-btn").addEventListener("click", () => {
        currentPhotoIndex = (currentPhotoIndex + 1) % photosData.length;
        updatePhotoBook();
      });

      document.getElementById("prev-btn").addEventListener("click", () => {
        currentPhotoIndex =
          (currentPhotoIndex - 1 + photosData.length) % photosData.length;
        updatePhotoBook();
      });

      function createFloatingShapes() {
        // Function to generate a random color
        function getRandomColor() {
          const r = Math.floor(Math.random() * 256);
          const g = Math.floor(Math.random() * 256);
          const b = Math.floor(Math.random() * 256);
          return new THREE.Color(r / 255, g / 255, b / 255); // Return a THREE.Color object
        }

        // 1. Heart Shape creation function
        function createHeartGeometry() {
          const heartShape = new THREE.Shape();
          heartShape.moveTo(0, 0);
          heartShape.bezierCurveTo(0, 0.8, 0.7, 1.2, 1, 1);
          heartShape.bezierCurveTo(1.3, 1.2, 2, 0.8, 2, 0);
          heartShape.bezierCurveTo(2, -1.3, 1.3, -2, 1, -2);
          heartShape.bezierCurveTo(0.7, -2, 0, -1.3, 0, 0);

          const geometry = new THREE.ShapeGeometry(heartShape);
          return geometry;
        }

        // 2. Small Dot (Sphere) creation function
        function createDotGeometry() {
          const geometry = new THREE.SphereGeometry(0.5, 16, 16); // Small sphere (dot)
          return geometry;
        }

        function createEllipseGeometry() {
          // Create an ellipse curve
          const ellipseCurve = new THREE.EllipseCurve(
            0,
            0, // ax, aY
            2,
            1, // xRadius, yRadius
            0,
            Math.PI * 2, // Start and End angle
            false, // Clockwise
            0 // Rotation in radians
          );

          // Get points from the curve
          const points = ellipseCurve.getPoints(50); // Get 50 points along the curve

          // Create a Shape using the points
          const shape = new THREE.Shape(points);

          // Create the geometry from the shape
          const geometry = new THREE.ShapeGeometry(shape);

          return geometry;
        }

        // Create floating shapes (hearts, dots, and ellipses) in large numbers
        const numberOfShapes = 1372; // Reasonable number for a smoother performance

        for (let i = 0; i < numberOfShapes; i++) {
          let shapeGeometry;
          let shapeType = Math.floor(Math.random() * 3); // Randomly pick a shape type

          if (shapeType === 0) {
            shapeGeometry = createHeartGeometry();
          } else if (shapeType === 1) {
            shapeGeometry = createDotGeometry();
          } else {
            shapeGeometry = createEllipseGeometry();
          }

          const material = new THREE.MeshBasicMaterial({
            color: getRandomColor(),
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.8,
          });

          const shape = new THREE.Mesh(shapeGeometry, material);

          // Position the shape randomly in the scene
          shape.position.set(
            Math.random() * 200 - 100, // Random x position
            Math.random() * 100 - 50, // Random y position
            Math.random() * 100 - 50 // Random z position
          );
          shape.rotation.set(
            Math.random() * Math.PI,
            Math.random() * Math.PI,
            Math.random() * Math.PI
          );

          scene.add(shape);

          // Animate the shape (floating up and down)
          gsap.to(shape.position, {
            y: shape.position.y + Math.random() * 10,
            duration: 2 + Math.random() * 2,
            repeat: -1,
            yoyo: true,
            ease: "power1.inOut",
          });

          // Animate the shape's rotation
          gsap.to(shape.rotation, {
            z: shape.rotation.z + Math.PI * 2,
            duration: 4 + Math.random() * 4,
            repeat: -1,
            ease: "none",
          });
        }
      }

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      animate();

      // Responsive handling
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
