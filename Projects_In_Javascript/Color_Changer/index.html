<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer Theme</title>
    <style>
        .black{
            background-color: black;
            color: white;
            border: 2px solid white;    
        }
        .white{
            background-color: white;
            color: black;
            border: 2px solid black;
        }
        .green{
            background-color: green;
        }
        .red{
            background-color: red;
        }
        .blue{
            background-color: blue;
        }
        .canvas{
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .buttons{
            display: flex;
            gap: 10px;
        }
        .btn{
            width: 100px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="canvas">
        <h1>Color  Theme Changer JS Project 

        </h1>
        <p>This is just a demo video in JS not in CSS that will be done later on </p>
        <div class="buttons">
            <div class="btn black">Black</div>
            <div class="btn white">White</div>
            <div class="btn green">Green</div>
            <div class="btn red">Red</div>
            <div class="btn blue">Blue</div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
