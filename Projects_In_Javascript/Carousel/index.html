<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: #c9c9c956;
      }
      .carousel-main {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px 0;
        font-family: Arial, sans-serif;
      }
      .top-text-content {
        text-align: center;
      }
      .blue-line {
        width: 100px;
        height: 4px;
        background-color: blue;
        margin: 10px auto;
      }
      .outer-box {
        width: 600px;
        height: 400px;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 20px;
      }
      .inner-contents {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .image {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        overflow: hidden;
        border-top: 8px solid blue;
        border-right: 2px solid blue;
        border-bottom: 3px solid transparent;
        border-left: 3px solid transparent;
      }

      .image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
     .quote-circle{
        height: 40px;
        width: 40px;
        border-radius: 50%;
        background-color: blue;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.5em;
        position: relative;
        left: -50px;
        top: 50px;
        align-items: center;
        text-align: center;
        font-size: 54px;    
     
      }
      .contents {
        display: flex;
        flex-direction: column;
        text-align: center;
        padding: 20px;
        gap: 10px;
      }
      .title {
        font-size: 1.5em;
        font-weight: bold;
        letter-spacing: 1.6px;
      }
      .designation {
        color: blue;
        font-size: 0.9em;
        text-transform: uppercase;
        letter-spacing: 1.2px;
      }
      .review {
        font-size: 0.9em;
        color: rgb(167, 163, 163);
      }
      .upper-btns button {
        border: none;
        background-color: transparent;
        font-size: 1.5em;
        cursor: pointer;
        color: blue;
      }
      .surprise-btn {
        padding: 10px 20px;
        border: 1px solid blue;
        background-color: rgb(232, 232, 255);
        color: blue;
        font-size: 1em;
        cursor: pointer;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="carousel-main">
      <div class="top-text-content">
        <h1>Our Reviews</h1>
        <div class="blue-line"></div>
      </div>

      <div class="outer-box">
        <div class="inner-contents">
        <div class="quote-circle">"</div>

          <div class="image">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBB4LQTn0vRq4ydPLp-uTj_lEUHOHYWUU18JlCq5KuMw&s=10" alt="" />
          </div>
          <div class="contents">
            <div class="title">John Doe</div>
            <div class="designation">Web Developer</div>
            <div class="review">
              Lorem ipsum, dolor sit amet consectetur adipisicing elit. Sit
              perferendis corporis saepe itaque laborum blanditiis architecto,
              alias numquam in nam possimus odio, repudiandae et optio veniam?
              Corporis soluta harum nam quia tempore.
            </div>
            <div class="btns">
              <div class="upper-btns">
                <button class="prev-btn">&lt;</button>
                <button class="next-btn">&gt;</button>
              </div>

              <button class="surprise-btn">Surprise Me!</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
